name: Flutter APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub එකේ දැනට තියෙන ඔයාගේ පිරිසිදු කෝඩ් එක කෙලින්ම සර්වර් එකට ගැනීම
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Java පද්ධතිය සකසා ගැනීම
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Flutter මෘදුකාංගය සර්වර් එකට දැමීම
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Android Template එක සාර්ථකව සෑදීම
      - name: Create Base Android Structure
        run: |
          flutter create --org com.garmex.ytclone --project-name youtube_premium_clone . --force

      # 5. පැකේජ් ඉන්ස්ටෝල් කිරීම
      - name: Install dependencies
        run: flutter pub get

      # 6. APK එක නිපදවීම
      - name: Build APK
        run: flutter build apk --release

      # 7. සෑදූ APK එක ඩවුන්ලෝඩ් කිරීමට ලබා දීම
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-premium-apk
          path: build/app/outputs/flutter-apk/app-release.apk
