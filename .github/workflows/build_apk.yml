name: Flutter APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Create Base Android Structure
        run: |
          flutter create --org com.garmex.ytclone --project-name youtube_premium_clone .

      - name: Force Inject Latest Stable Packages
        run: |
          flutter pub add youtube_explode_dart
          flutter pub add video_player

      - name: Install dependencies
        run: flutter pub get

      # Kotlin Version එක අලුත්ම 1.9.20 එකට ඔටෝම මාරු කර ගැළපීම් ප්‍රශ්න විසඳීමේ පියවර
      - name: Upgrade Kotlin and Fix Proguard Issues
        run: |
          # 1. settings.gradle එක ඇතුළේ තියෙන පරණ Kotlin අනුවාදය 1.9.20 වලට මාරු කිරීම
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.20"/g' android/settings.gradle
          fi
          
          # 2. පරණ Proguard ගැටලුව සම්පූර්ණයෙන්ම මකා දැමීම
          if [ -f android/app/build.gradle ]; then
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle.kts
          fi
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-premium-apk
          path: build/app/outputs/flutter-apk/app-release.apk
