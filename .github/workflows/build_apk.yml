name: Flutter APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0' # උඹ දාපු සුපිරි Update එක
          cache: true # බිල්ඩ් එක වේගවත් කිරීමට උඹ දාපු කෑල්ල

      - name: Create Base Android Structure
        run: |
          flutter create --org com.garmex.ytclone --project-name youtube_premium_clone .

      - name: Install dependencies
        run: flutter pub get

      # උඹ ලියපු ලොජික් එක සහ .pub-cache එක යන දෙකම 100%ක්ම නිවැරදි කරන ක්‍රමය
      - name: Fix Android Proguard Issue (Project & Pub-Cache)
        run: |
          # 1. ඔබ ලියූ ප්‍රොජෙක්ට් එක ඇතුළේ ඇති ෆයිල් නිවැරදි කිරීම
          if [ -f android/app/build.gradle ]; then
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle.kts
          fi
          
          # 2. වැරැද්ද ඇති කරන බාහිර පැකේජ් (.pub-cache) එක ඇතුළේ ඇති සියල්ල ඔටෝ නිවැරදි කිරීම
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-premium-apk
          path: build/app/outputs/flutter-apk/app-release.apk
