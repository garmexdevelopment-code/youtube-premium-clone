name: Flutter APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Create Base Android Structure
        run: |
          flutter create --org com.garmex.ytclone --project-name youtube_premium_clone .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Android Proguard and Kotlin Issue
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.20"/g' android/settings.gradle
          fi
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-premium-apk
          path: build/app/outputs/flutter-apk/app-release.apk
