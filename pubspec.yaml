  youtube_player_flutter: ^9.1.1
  just_audio: ^0.9.36
  path_provider: ^2.1.1
  dio: ^5.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
