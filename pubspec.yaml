publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # YouTube හි අලුත්ම ආරක්ෂක කේතයන් බිඳ දැමීමට පැකේජ් එක අලුත් කර ඇත
